# Base Configuration
version: "1"
imageTag: "us-west1-docker.pkg.dev/holomua-demo/gcp-demo-registry/gcp-demo-api:latest"
artifactDir: "artifacts"
gatecheckBundleFilename: "gatecheck-bundle.tar.gz"

# Image Build Configuration
imageBuild:
  enabled: true
  buildDir: "."
  dockerfile: "Dockerfile"
  platform: ""
  target: ""
  cacheTo: ""
  cacheFrom: ""
  squashLayers: false
  args: {}

# Image Scan Configuration
imageScan:
  enabled: true
  syftFilename: "syft-sbom-report.json"
  grypeConfigFilename: ""
  grypeFilename: "grype-vulnerability-report-full.json"
  clamavFilename: "clamav-virus-report.txt"

# Code Scan Configuration
codeScan:
  enabled: true
  gitleaksFilename: "gitleaks-secrets-report.json"
  gitleaksSrcDir: "."
  semgrepFilename: "semgrep-sast-report.json"
  semgrepRules: "p/default"
  semgrepExperimental: false
  coverageFile: ""
  semgrepSrcDir: "."

# Image Publish Configuration
imagePublish:
  enabled: false
  bundleTag: "us-west1-docker.pkg.dev/holomua-demo/gcp-demo-registry/gcp-demo-api/bundle:latest"

# Deploy Configuration
deploy:
  enabled: true
  gatecheckConfigFilename: ".gatecheck.yml"
  # Report mode: gatecheck still runs and prints its result, but the build is always submitted and Belay
  # makes the deploy decision (Belay's thresholds + approved POA&Ms). Belay also flags config drift.
  validation: report
  # Validate against Belay's policy for this repo/branch (the local .gatecheck.yml is ignored when set).
  # Uses the webhook's authorizationVar for the token. Regenerate the local file from Belay for local runs.
  policyUrl: "https://belay-api.holomuatech.com/Policy/HolomuaTech/gcp-demo-api/gatecheck?branch=main"
  submit: true
  successWebhooks:
    - url: "https://belay-api.holomuatech.com/Build/SubmitArtifacts"
      authorizationVar: "DEPLOY_API_WEBHOOK_AUTH_HEADER"