steps:
  # create the artifacts directory for portage and allow it to write to the directory
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args: ['-c', 'mkdir -p /workspace/artifacts && chmod 777 /workspace/artifacts | ls -la']
  
  # Tell me about yourself cloud-builders/docker
  - name: 'gcr.io/cloud-builders/docker'
    args: ['context', 'ls']

  # Create a file with the secret for use in the next step
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo $$DEPLOY_API_WEBHOOK_AUTH_HEADER_SECRET > /workspace/auth_token.txt
    secretEnv: ['DEPLOY_API_WEBHOOK_AUTH_HEADER_SECRET']

  # Cloudbuild checks out a commit behind the scenes resulting in a headless branch. We need to set the branch name to
  # the provided substitution variable for portage to properly collect and send the build artifacts
  - name: 'gcr.io/cloud-builders/git'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [ ! -z "$BRANCH_NAME" ]; then
          echo "Switching to branch $BRANCH_NAME"
          git checkout -b "$BRANCH_NAME"
        fi

  # Build the container image, run the code and image scans, and bundle the reports with portage.
  # Deploy is disabled here so Belay is not notified until the image has been pushed (see the last step).
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker run --user root \
        -v /var/run/docker.sock:/var/run/docker.sock -v /workspace:/app:rw \
        -e PORTAGE_DEPLOY_ENABLED=false \
        -e PORTAGE_BUILD_GROUP_ID="gcp:$PROJECT_ID:$BUILD_ID" \
        -e PORTAGE_IMAGE_NAME="us-west1-docker.pkg.dev/holomua-demo/gcp-demo-registry/${_SERVICE}" \
        -e PORTAGE_IMAGE_TAG="us-west1-docker.pkg.dev/holomua-demo/gcp-demo-registry/${_SERVICE}:latest" \
        -e PORTAGE_BUILD_IMAGE_NAMES="us-west1-docker.pkg.dev/holomua-demo/gcp-demo-registry/${_SERVICE}" \
        --entrypoint sh ghcr.io/easy-up/portage:belay-main-latest \
        -c "echo \"Current Branch: $$(git rev-parse --abbrev-ref HEAD)\" && \
            git config --global --add safe.directory /app && \
            printenv PORTAGE_BUILD_GROUP_ID PORTAGE_IMAGE_NAME PORTAGE_BUILD_IMAGE_NAMES && \
            portage run all -v"

  # Push the container image to Artifact Registry. This must finish before Belay is notified,
  # because Belay triggers the deploy build as soon as it accepts the submission.
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-west1-docker.pkg.dev/holomua-demo/gcp-demo-registry/${_SERVICE}:latest']

  # Confirm the pushed image, validate the bundle with gatecheck, and submit it to Belay.
  # Runs only after the push above succeeds.
  # - waitForImage polls the registry until the tag points at the image built in this run
  #   (matched via the docker socket) and records its digest in the bundle sent to Belay.
  # - Pushing used Cloud Build's own credentials. Portage only needs to READ the registry, so it
  #   logs oras in with a short-lived token for the build's service account from the metadata
  #   server (--network cloudbuild). No registry credentials are stored or passed in.
  # - The Belay auth token is passed in as an environment variable via a file read due to running portage from docker
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        AUTH_TOKEN=$(cat /workspace/auth_token.txt) && \
        docker run --user root --network cloudbuild \
        -v /var/run/docker.sock:/var/run/docker.sock -v /workspace:/app:rw \
        -e DEPLOY_API_WEBHOOK_AUTH_HEADER="$${AUTH_TOKEN}" \
        -e PORTAGE_DEPLOY_WAIT_FOR_IMAGE=true \
        -e PORTAGE_BUILD_GROUP_ID="gcp:$PROJECT_ID:$BUILD_ID" \
        -e PORTAGE_IMAGE_NAME="us-west1-docker.pkg.dev/holomua-demo/gcp-demo-registry/${_SERVICE}" \
        -e PORTAGE_IMAGE_TAG="us-west1-docker.pkg.dev/holomua-demo/gcp-demo-registry/${_SERVICE}:latest" \
        -e PORTAGE_BUILD_IMAGE_NAMES="us-west1-docker.pkg.dev/holomua-demo/gcp-demo-registry/${_SERVICE}" \
        --entrypoint sh ghcr.io/easy-up/portage:belay-main-latest \
        -c 'wget -qO- --header "Metadata-Flavor: Google" \
              http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token \
              | sed -E "s/.*\"access_token\":\"([^\"]*)\".*/\1/" \
              | oras login us-west1-docker.pkg.dev -u oauth2accesstoken --password-stdin && \
            git config --global --add safe.directory /app && \
            portage run deploy -v'

images:
  - 'us-west1-docker.pkg.dev/holomua-demo/gcp-demo-registry/${_SERVICE}'

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/gcp-demo-deploy-api-webhook-auth-header/versions/latest
      env: 'DEPLOY_API_WEBHOOK_AUTH_HEADER_SECRET'

options:
  logging: CLOUD_LOGGING_ONLY
