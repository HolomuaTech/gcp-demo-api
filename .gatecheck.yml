gitleaks:
  limitEnabled: true
  limit: 0
semgrep:
  severityLimit:
    error:
      enabled: true
      limit: 2
grype:
  # Ignore vulnerabilities with very low Exploit Probability Scores
  epssRiskAcceptance:
    enabled: true
    score: 0.001
  kevLimitEnabled: false
  severityLimit:
    critical:
      enabled: true
      limit: 292
    high:
      enabled: true
      limit: 1414
cyclonedx:
  kevLimitEnabled: false
coverage:
  lineThreshold: 0
  functionThreshold: 0
  branchThreshold: 0
